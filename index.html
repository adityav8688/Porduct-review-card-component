<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <header></header>
  <main>
    <div class="card">
      <picture>
        <source media="(min-width: 376px)" srcset="./images/image-product-desktop.jpg" class="desktop-img">
        <img src="./images/image-product-mobile.jpg" alt="product img" class="mobile-img">
      </picture>
      <div class="card-content">
        <p id="perfume">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p> A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>
          <div class="prices">
            <h1>$149.99</h1>
            <p><del>$169.99</del></p>
          </div>
          <div class="add-to-cart">
            <a href="">Add to Cart</a>
          </div>
      </div>
      </div>
    </section>
  </main>
</body>
</html>
